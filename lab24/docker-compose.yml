services:
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./docker/init-mongo.js:/docker-entrypoint-initdb.d/001-user.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    image: ${APP_IMAGE:-lab24-api:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGODB_URI: mongodb://student:${DB_PASSWORD}@mongo:27017/lab24?authSource=lab24
      DB_NAME: lab24
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - avatars:/app/uploads
      - outbox:/app/outbox
volumes:
  mongo-data:
  avatars:
  outbox:
